<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - 2027 Batch</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --moss: #2C3424;
    --cypress: #4C5B3E;
    --olive: #768064;
    --cedar: #9B9581;
    --aloe: #DADED8;
    --paper: #f8faf7;
}

body {
    min-height: 100vh;
    padding: 0 7% 28px;
    font-family: 'Poppins', sans-serif;
    color: var(--moss);
    background: linear-gradient(135deg, var(--aloe) 0%, #bfc8ba 48%, var(--cedar) 100%);
}

.navbar {
    width: 100vw;
    margin: 0 0 16px calc(50% - 50vw);
    background: var(--cedar);
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
}
.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
}
.nav-logo {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--moss);
    text-decoration: none;
}
.nav-logo img { width: 50px; height: 50px; border-radius: 10px; }
.logo-text { font-size: 1.5rem; font-weight: 700; }
.nav-menu { display: flex; align-items: center; gap: 2rem; }
.nav-link {
    color: var(--paper);
    text-decoration: none;
    font-weight: 600;
    position: relative;
}
.nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0;
    height: 2px;
    background: var(--paper);
    transition: width 0.25s ease;
}
.nav-link:hover::after,
.nav-link.active::after { width: 100%; }

.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 3vw, 2.4rem); }
.header p { margin-top: 6px; color: var(--cypress); }
.header::after {
    content: '';
    display: block;
    width: 72px;
    height: 3px;
    margin: 8px auto 0;
    background: var(--cypress);
    border-radius: 2px;
}

.team-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
}

.team-card {
    min-height: 360px;
    padding: 20px 18px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: rgba(248, 250, 247, 0.94);
    border: 1px solid rgba(76, 91, 62, 0.16);
    border-radius: 12px;
    box-shadow: 0 12px 28px rgba(44, 52, 36, 0.16);
}

.profile-photo-frame,
.diya-photo-frame {
    width: 172px;
    height: 172px;
    flex: 0 0 172px;
    margin-bottom: 22px;
    border: 4px solid var(--aloe);
    border-radius: 50%;
    background: var(--cypress);
    overflow: hidden;
}

.profile-photo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.prachi-photo {
    transform: scale(2.8);
    transform-origin: 50% 30%;
}

.azriel-photo {
    transform: scale(2.55);
    transform-origin: 50% 34%;
    position: relative;
    top: -8px;
}

.diya-photo {
    width: 100%;
    height: 100%;
    position: relative;
    left: -16px;
    top: -14px;
    object-fit: cover;
    transform: scale(2.4);
    transform-origin: 50% 30%;
}

.team-card h2 { font-family: 'Playfair Display', serif; font-size: 1.55rem; }
.role { min-height: 48px; margin-top: 5px; color: var(--cypress); font-weight: 500; }
.contact-details { margin-top: auto; padding-top: 20px; font-size: 0.9rem; }
.contact-details strong { display: block; margin-top: 7px; color: var(--cypress); }
.contact-link { color: var(--moss); text-decoration: none; overflow-wrap: anywhere; }
.contact-link:hover { color: var(--olive); text-decoration: underline; }

.back-section { display: flex; justify-content: center; margin-top: 32px; }
.back-btn {
    padding: 11px 26px;
    color: var(--paper);
    background: var(--moss);
    border-radius: 24px;
    font-weight: 500;
    text-decoration: none;
}
.back-btn:hover { background: var(--cypress); }

@media (max-width: 850px) {
    .team-grid { grid-template-columns: 1fr; max-width: 430px; }
    .team-card { min-height: 0; }
    .role { min-height: 0; }
}
</style>
<link rel="stylesheet" href="dpniti-widget.css">
</head>

        </a>
        <div class="nav-menu">

</html>
