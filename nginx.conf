server {
    listen 80;

    # ── Pages that DO NOT require login ────────────────────────────────
    # The login page itself, and anything under /login/, must stay open
    # so a logged-out user can actually reach the login form.
    location /login/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /login/index.html;
    }

    # config.js is the ONLY asset outside /login/ the login page needs
    # (login/style.css and login/login.js are already covered by the
    # /login/ block above). Do NOT widen this to a blanket *.js/*.css
    # regex -- that would also expose dashboard.js, faculty-data.js
    # (which contains staff phone numbers/emails/cabins), dashboard.css,
    # and every image under /images/ without login.
    location = /config.js {
        root /usr/share/nginx/html;
    }

    # ── Internal-only: Nginx calls this itself, browsers never hit it ──
    location = /auth/verify {
        internal;
        proxy_pass http://backend:5000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Where auth_request sends anyone who fails the check.
    location @needs_login {
        return 302 /login/index.html;
    }

    # ── Every other page requires a valid login cookie ─────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;

        auth_request /auth/verify;
        error_page 401 = @needs_login;

        try_files $uri $uri/ =404;
    }

    # Proxy API calls to Node.js backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy chatbot calls to Python Flask/FastAPI service
    location /chat {
        proxy_pass http://chatbot:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
}